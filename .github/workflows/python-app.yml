
# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main", "fast-api-integration" ]
  pull_request:
    branches: [ "main", "fast-api-integration" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run FastAPI app and test endpoints
      run: |
        # Start uvicorn in background
        python -m uvicorn app.app:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
        UVICORN_PID=$!
        sleep 5
        
        # Test root endpoint
        echo "Testing GET /"
        curl -f -s http://127.0.0.1:8000/ > /dev/null || (cat /tmp/uvicorn.log && exit 1)
        
        # Test health endpoint
        echo "Testing GET /health"
        curl -f -s http://127.0.0.1:8000/health > /dev/null || (cat /tmp/uvicorn.log && exit 1)
        
        # Test calculate endpoint
        echo "Testing POST /calculate"
        curl -f -s -X POST http://127.0.0.1:8000/calculate \
          -H "Content-Type: application/json" \
          -d '{"coord_list":[[0,0],[4,0],[4,3]],"assume_unordered":false}' > /tmp/response.json
        
        # Verify response contains success
        grep -q "success" /tmp/response.json || (cat /tmp/response.json && cat /tmp/uvicorn.log && exit 1)
        
        # Cleanup
        kill $UVICORN_PID 2>/dev/null || true
        sleep 1
